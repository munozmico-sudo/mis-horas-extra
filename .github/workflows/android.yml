      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MisHorasExtra.apk

      - name: Guardar APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: MisHorasExtra-apk
          path: MisHorasExtra.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mis Horas Extra v1.0.${{ github.run_number }}
          files: MisHorasExtra.apk

